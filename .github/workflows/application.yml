name: Application and local platform
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOOLS_DIR: ${{ github.workspace }}/.local/bin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned platform and security tools
        run: |
          mkdir -p .local
          python scripts/install-lab-tools.py
          echo "$TOOLS_DIR" >> "$GITHUB_PATH"
          pip install -r app/requirements.txt -r tests/requirements.txt
      - name: Unit tests and manifest rendering
        run: make validate
      - name: Build and check standalone observability
        run: |
          make compose-up
          make compose-check
      - name: Scan image and generate SBOM
        run: |
          mkdir -p .local/records
          trivy image --quiet --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --format json --output .local/records/trivy.json portfolio-api:v1
          syft portfolio-api:v1 -o spdx-json=.local/records/sbom.spdx.json
          python security/image-manifest.py
      - name: Upload small supply-chain records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supply-chain-records
          path: .local/records/
          include-hidden-files: true
          retention-days: 1
      - name: Stop standalone app before GitOps mode
        run: make compose-down
      - name: Bootstrap and verify GitOps at this source revision
        if: github.event_name != 'pull_request'
        env:
          GITOPS_REVISION: ${{ github.sha }}
        run: |
          make gitops-up
          make gitops-check
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          docker compose logs --tail=40
          if [ -f .local/kubeconfig ]; then
            kubectl --kubeconfig .local/kubeconfig get pods -A
            kubectl --kubeconfig .local/kubeconfig -n argocd get application portfolio -o yaml || true
          fi
      - name: Clean up all local lab resources
        if: always()
        run: |
          make compose-down
          make gitops-down
  attest:
    needs: application
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: supply-chain-records
          path: .local/records
      - name: Install verified Cosign
        env:
          LAB_TOOLS: cosign
          TOOLS_DIR: ${{ github.workspace }}/.local/bin
        run: |
          python scripts/install-lab-tools.py
          echo "$TOOLS_DIR" >> "$GITHUB_PATH"
      - name: Keyless sign and verify the image manifest
        run: |
          cosign sign-blob --yes --bundle .local/records/manifest.sigstore.json .local/records/manifest.json
          cosign verify-blob --bundle .local/records/manifest.sigstore.json --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/application.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com .local/records/manifest.json
          cp .local/records/manifest.json .local/tampered.json
          printf '\nchanged\n' >> .local/tampered.json
          if cosign verify-blob --bundle .local/records/manifest.sigstore.json --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/application.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com .local/tampered.json; then
            echo 'ERROR: tampered manifest was accepted'
            exit 1
          fi
          echo 'PASS: tampered manifest rejected'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-supply-chain-records
          path: .local/records/
          include-hidden-files: true
          retention-days: 1
