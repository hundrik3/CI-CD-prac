name: Free infrastructure checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Terraform, security and pipeline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned official revision
        with:
          python-version: "3.12"
      - name: Install verified tools and initialize without remote state
        env:
          TOOLING_ROOT: ${{ runner.temp }}/project26-tools
        run: |
          sh scripts/install-tools.sh
          echo "$TOOLING_ROOT/bin" >> "$GITHUB_PATH"
          echo "$TOOLING_ROOT/venv/bin" >> "$GITHUB_PATH"
      - name: Check formatting and configuration
        run: |
          terraform fmt -check -recursive
          terraform -chdir=infra validate -no-color
          terraform -chdir=bootstrap validate -no-color
      - name: Test infrastructure plans with mocked AWS
        run: terraform -chdir=infra test -no-color
      - name: Test GitLab pipeline controls
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: sh -n scripts/ci-init.sh scripts/install-tools.sh
      - name: Enforce high and critical security gate
        run: |
          tfsec infra --minimum-severity HIGH --no-color
          tfsec bootstrap --minimum-severity HIGH --no-color
      - name: Record scope of successful checks
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Credential-free infrastructure validation
          - Terraform format and both configurations validated.
          - Five AWS mock-plan runs and three pipeline-control tests passed.
          - High/critical tfsec gates passed with one documented HTTPS egress exception.
          - Three known medium findings remain documented in docs/validation.md.
          - No real AWS plan, apply, destroy, OIDC exchange or GitLab hosted run was performed.
          EOF
