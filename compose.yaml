name: ci-cd-prac
services:
  app:
    image: portfolio-api:v1
    build:
      context: ./app
      secrets:
      - proxy_ca
    ports:
    - 127.0.0.1:8080:8080
    environment:
      APP_VERSION: v1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      NO_PROXY: otel-collector,localhost,127.0.0.1
      no_proxy: otel-collector,localhost,127.0.0.1
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    depends_on:
    - otel-collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command:
    - --config=/etc/otel/config.yaml
    environment:
      APP_SCRAPE_TARGET: app:8080
      NO_PROXY: tempo,loki,app,localhost,127.0.0.1
      no_proxy: tempo,loki,app,localhost,127.0.0.1
    volumes:
    - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    depends_on:
    - tempo
    - loki
  prometheus:
    image: prom/prometheus:v3.2.1
    command:
    - --config.file=/etc/prometheus/prometheus.yaml
    ports:
    - 127.0.0.1:9090:9090
    volumes:
    - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    environment:
      NO_PROXY: otel-collector,localhost,127.0.0.1
      no_proxy: otel-collector,localhost,127.0.0.1
  tempo:
    image: grafana/tempo:2.7.2
    command:
    - -config.file=/etc/tempo.yaml
    ports:
    - 127.0.0.1:3200:3200
    volumes:
    - ./observability/tempo.yaml:/etc/tempo.yaml:ro
  loki:
    image: grafana/loki:3.4.2
    command:
    - -config.file=/etc/loki.yaml
    ports:
    - 127.0.0.1:3100:3100
    volumes:
    - ./observability/loki.yaml:/etc/loki.yaml:ro
  grafana:
    image: grafana/grafana:11.6.0
    ports:
    - 127.0.0.1:3000:3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      NO_PROXY: prometheus,tempo,loki,localhost,127.0.0.1
      no_proxy: prometheus,tempo,loki,localhost,127.0.0.1
    volumes:
    - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
secrets:
  proxy_ca:
    file: ${BUILD_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
