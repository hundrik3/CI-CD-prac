apiVersion: v1
kind: Namespace
metadata:
  name: progressive-delivery
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: release-api
  namespace: progressive-delivery
spec:
  replicas: 5
  selector:
    matchLabels:
      app: release-api
  template:
    metadata:
      labels:
        app: release-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: app
        image: portfolio-api:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: APP_VERSION
          value: v1
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
  strategy:
    canary:
      stableService: release-stable
      canaryService: release-canary
      maxSurge: 1
      maxUnavailable: 0
      steps:
      - setWeight: 20
      - pause: {}
      - analysis:
          templates:
          - templateName: canary-quality
      - setWeight: 60
      - pause: {}
      - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: release-stable
  namespace: progressive-delivery
spec:
  type: NodePort
  selector:
    app: release-api
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: release-canary
  namespace: progressive-delivery
spec:
  type: NodePort
  selector:
    app: release-api
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30082
---
apiVersion: v1
kind: Service
metadata:
  name: release-api
  namespace: progressive-delivery
spec:
  type: NodePort
  selector:
    app: release-api
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30083
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: progressive-delivery
spec:
  ports:
  - port: 9090
    targetPort: 9090
